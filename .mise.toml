[tools]
go = "latest"
prek = "latest"

[tasks.fmt]
description = "Format all code"
run = "gofumpt -w ."

[tasks.lint]
description = "Lint all code"
run = "go vet ./..."

[tasks.build]
description = "Build the binary"
run = "go build -o dbx ./cmd/dbx"

[tasks.check]
description = "Full validation (fmt check + vet + build)"
run = ["gofumpt -d -l . | (! grep .)", "go vet ./...", "go build -o dbx ./cmd/dbx"]

[tasks.install]
description = "Build and install to /usr/local/bin"
run = ["go build -o dbx ./cmd/dbx", "sudo install dbx /usr/local/bin/dbx"]
